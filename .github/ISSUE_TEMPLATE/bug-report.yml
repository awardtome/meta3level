name: Bug report
description: Report a reproducible software or statistical-output problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or de-identified data only. Never upload confidential coding sheets.
  - type: input
    id: version
    attributes:
      label: meta3level version
      placeholder: "0.6.2"
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Analysis level
      options:
        - Three-level
        - Conventional single-level
        - Data preparation only
        - Publication-bias or sensitivity analysis
    validations:
      required: true
  - type: dropdown
    id: measure
    attributes:
      label: Effect measure
      options:
        - Correlation r
        - Cohen's d
        - Hedges' g
        - Odds ratio
        - Custom yi and vi
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and complete error or warning
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible R code
      render: r
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: sessionInfo()
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I confirm that the report contains no identifiable or confidential research data.
          required: true

