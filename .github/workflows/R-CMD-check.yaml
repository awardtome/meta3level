name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: "release"}
          - {os: macos-latest, r: "release"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

  native-template-smoke-test:
    runs-on: ubuntu-latest
    name: Native skill template smoke test

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::metafor

      - name: Check repository structure and local links
        shell: Rscript {0}
        run: source("tools/check-repository.R")

      - name: Parse every R example in the Chinese user manual
        run: Rscript tools/check-manual-code.R USER_MANUAL.zh-CN.md

      - name: Parse native R templates
        shell: Rscript {0}
        run: |
          parse(file = "skills/run-meta-analysis-r/assets/native-metafor-template.R")
          parse(file = "examples/01-correlation-three-level.R")
          parse(file = "examples/02-independent-d-three-level.R")
          parse(file = "examples/03-odds-ratio-three-level.R")
          parse(file = "examples/04-conventional-meta-analysis.R")

      - name: Run native template across effect types
        shell: Rscript {0}
        run: source("tools/smoke-test-native-template.R")

      - name: Install the package from the repository
        run: R CMD INSTALL .

      - name: Run the Chinese user manual smoke test
        run: Rscript tools/smoke-test-user-manual.R .

      - name: Run every public example
        shell: Rscript {0}
        run: |
          paths <- sort(list.files("examples", pattern = "[.]R$", full.names = TRUE))
          stopifnot(length(paths) > 0)
          for (path in paths) {
            grDevices::pdf(tempfile(fileext = ".pdf"))
            tryCatch(
              sys.source(path, envir = new.env(parent = globalenv())),
              finally = grDevices::dev.off()
            )
            message("Example passed: ", basename(path))
          }
